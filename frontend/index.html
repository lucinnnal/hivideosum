<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Hi-VideoSum</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2em auto; padding: 0 1em; line-height: 1.6; }
    h1 { font-size: 1.5em; }
    input[type=url] { width: 100%; padding: 0.6em; font-size: 1em; }
    button { padding: 0.6em 1.2em; font-size: 1em; cursor: pointer; }
    .status { margin: 1em 0; color: #555; }
    .summary { white-space: pre-wrap; background: #f6f6f6; padding: 1em; border-radius: 6px; }
    .error { color: #b00020; }
    .paragraph + .paragraph { margin-top: 1em; }
    .label { font-weight: bold; font-size: 0.85em; color: #666; display: block; margin-bottom: 0.3em; }
  </style>
</head>
<body>
  <h1>Hi-VideoSum</h1>
  <p>유튜브 URL을 입력하면 자막과 댓글을 분석하여 3문단 산문 요약을 생성합니다.</p>
  <form id="form">
    <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." required>
    <p><button type="submit">요약 시작</button></p>
  </form>
  <div id="status" class="status"></div>
  <div id="result"></div>

  <script src="app.js"></script>
</body>
</html>
